# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "utils_nfcore_bacass_pipeline"
description: Pipeline-specific utility workflows for initialisation, parameter validation, completion hooks, and methods text rendering
keywords:
  - utils
  - initialisation
  - completion
  - schema
  - methods
  - multiqc
components:
  - utils_nfschema_plugin
  - utils_nfcore_pipeline
  - utils_nextflow_pipeline
input:
  - version:
      type: boolean
      description: |
        Structure: val(version)
        Display version information and exit when requested.
  - validate_params:
      type: boolean
      description: |
        Structure: val(validate_params)
        Enable runtime schema validation.
  - monochrome_logs:
      type: boolean
      description: |
        Structure: val(monochrome_logs)
        Disable ANSI colors in logs and summaries.
  - nextflow_cli_args:
      type: list
      description: |
        Structure: val(nextflow_cli_args)
        Positional Nextflow CLI arguments used for config checks.
  - outdir:
      type: string
      description: |
        Structure: val(outdir)
        Output directory for pipeline results.
  - input:
      type: string
      description: |
        Structure: val(input)
        Path to pipeline samplesheet.
  - help:
      type: boolean
      description: |
        Structure: val(help)
        Show concise command-line help.
  - help_full:
      type: boolean
      description: |
        Structure: val(help_full)
        Show extended command-line help.
  - show_hidden:
      type: boolean
      description: |
        Structure: val(show_hidden)
        Include hidden parameters in help output.
  - email:
      type: string
      description: |
        Structure: val(email)
        Email address for run completion notifications.
  - email_on_fail:
      type: string
      description: |
        Structure: val(email_on_fail)
        Email address for failure-only notifications.
  - plaintext_email:
      type: boolean
      description: |
        Structure: val(plaintext_email)
        Send plain-text notification emails.
  - hook_url:
      type: string
      description: |
        Structure: val(hook_url)
        Webhook URL for instant messaging notifications.
  - multiqc_report:
      type: file
      description: |
        Structure: [ path(multiqc_report.html) ]
        MultiQC report passed to completion notifications.
  - mqc_methods_yaml:
      type: file
      description: |
        Input template consumed by methodsDescriptionText() to generate HTML methods text.
output:
  - samplesheet:
      type: file
      description: |
        Structure: [ val(meta), path(reads), path(longreads), path(fast5) ]
        Parsed and validated samplesheet channel emitted by PIPELINE_INITIALISATION.
  - versions:
      type: file
      description: |
        Structure: [ path(versions.yml) ]
        Version channel emitted by PIPELINE_INITIALISATION (may be empty).
      pattern: "versions.yml"
  - methods_description_text:
      type: string
      description: |
        HTML methods section generated by methodsDescriptionText().
authors:
  - "@Daniel-VM"
  - "@d4straub"
maintainers:
  - "@Daniel-VM"
  - "@d4straub"
