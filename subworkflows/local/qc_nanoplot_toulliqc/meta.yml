# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "QC_NANOPLOT_TOULLIGQC"
description: Run NanoPlot and ToulligQC quality control on Nanopore reads
keywords:
  - qc
  - nanopore
  - nanoplot
  - toulligqc
  - long-reads
components:
  - nanoplot
  - toulligqc
input:
  - ch_fastq:
      type: file
      description: |
        Structure: [ val(meta), path(ontfile) ]
        Input Nanopore reads for QC.
  - skip_nanplot:
      type: boolean
      description: |
        Structure: val(skip_nanplot)
        If true, NanoPlot execution is skipped.
  - skip_toulligqc:
      type: boolean
      description: |
        Structure: val(skip_toulligqc)
        If true, ToulligQC execution is skipped.
output:
  - nanoplot_png:
      type: file
      description: |
        Structure: [ val(meta), path(*.png) ]
        PNG plots generated by NanoPlot.
  - nanoplot_html:
      type: file
      description: |
        Structure: [ val(meta), path(*.html) ]
        NanoPlot HTML report files.
  - nanoplot_txt:
      type: file
      description: |
        Structure: [ val(meta), path(*.txt) ]
        NanoPlot text statistics.
  - nanoplot_log:
      type: file
      description: |
        Structure: [ val(meta), path(*.log) ]
        NanoPlot log files.
  - nanoplot_version:
      type: file
      description: |
        Structure: [ path(versions.yml) ]
        Software versions emitted by the NanoPlot module.
      pattern: "versions.yml"
  - toulligqc_report_data:
      type: file
      description: |
        Structure: [ val(meta), path(*/*.data) ]
        ToulligQC report data files.
  - toulligqc_report_html:
      type: file
      description: |
        Structure: [ val(meta), path(*/*.html) ]
        ToulligQC HTML reports.
  - toulligqc_plots_html:
      type: file
      description: |
        Structure: [ val(meta), path(*/images/*.html) ]
        ToulligQC plot HTML files.
  - toulligqc_plotly_js:
      type: file
      description: |
        Structure: [ val(meta), path(*/images/plotly.min.js) ]
        Plotly JavaScript bundle emitted by ToulligQC.
authors:
  - "@Daniel-VM"
  - "@d4straub"
maintainers:
  - "@Daniel-VM"
  - "@d4straub"
