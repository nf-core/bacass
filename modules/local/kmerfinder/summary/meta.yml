name: kmerfinder_summary
description: Build consolidated KmerFinder summary tables for downstream reporting
keywords:
  - kmerfinder
  - summary
  - csv
  - yaml
  - reporting
tools:
  - python:
      description: |
        Python is used to run the custom helper scripts that aggregate KmerFinder outputs.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
input:
  - report:
      type: file
      description: List of per-sample KmerFinder result files
      pattern: "*_results.txt"
      ontologies: []
output:
  summary:
    - "*.csv":
        type: file
        description: Consolidated CSV table of KmerFinder metrics across samples
        pattern: "*.csv"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
  yaml:
    - "*.yaml":
        type: file
        description: YAML summary generated from the consolidated CSV table
        pattern: "*.yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@Daniel-VM"
maintainers:
  - "@Daniel-VM"
