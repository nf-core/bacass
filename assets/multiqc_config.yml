report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/bacass/tree/dev" target="_blank">nf-core/bacass</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/bacass/dev/docs/output" target="_blank">documentation</a>.

data_format: "yaml"

max_table_rows: 10000

run_modules:
  - custom_content
  - fastqc
  - fastp
  - nanostat
  - porechop
  - filtlong
  - pycoqc
  - kraken
  - quast
  - busco
  - prokka
  - bakta

module_order:
  - fastqc:
      name: "READ QC: FastQC (raw reads)"
      info: "This section of the report shows FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "./fastqc/*.zip"
  - fastqc:
      name: "READ QC: FastQC (trimmed reads)"
      info: "This section of the report shows FastQC results for the processed and trimmed reads."
      path_filters:
        - "./fastqc_trim/*.zip"
  - fastp:
      name: "READ QC: fastp"
      info: "This section of the report shows fastp results after adapter and quality trimming."
      path_filters:
        - "./fastp/*.json"
  - nanostat:
      name: "LONG-READ QC: NanoPlot / NanoStats"
      info: "This section of the report shows long-read summary statistics generated by NanoPlot."
      path_filters:
        - "./nanoplot??/*.txt"
  - porechop:
      name: "LONG-READ QC: Porechop"
      info: "This section of the report shows adapter trimming results for long reads."
      path_filters:
        - "./porechop/*.log"
  - filtlong:
      name: "LONG-READ QC: Filtlong"
      info: "This section of the report shows long-read filtering results."
      path_filters:
        - "./filtlong/*.log"
  - pycoqc:
      name: "LONG-READ QC: PycoQC"
      info: "This section of the report shows PycoQC results for long-read sequencing runs."
      path_filters:
        - "./pycoqc/*.json"
  - kraken:
      name: "TAXONOMY: Kraken 2"
      info: "This section of the report shows Kraken 2 classification results for reads."
      path_filters:
        - "./kraken2_*/*report.txt"
  - quast:
      name: "ASSEMBLY QC: QUAST"
      info: "This section of the report shows assembly quality metrics generated by QUAST."
      path_filters:
        - "./quast/*/report.tsv"
  - busco:
      name: "ASSEMBLY QC: BUSCO"
      info: "This section of the report shows BUSCO completeness results for assembled genomes."
      path_filters:
        - "./busco/*"
  - prokka:
      name: "ANNOTATION: Prokka"
      info: "This section of the report shows Prokka annotation results."
      path_filters:
        - "./prokka/*.txt"
  - bakta:
      name: "ANNOTATION: Bakta"
      info: "This section of the report shows Bakta annotation results."
      path_filters:
        - "./bakta/*.txt"

report_section_order:
  nf-core-bacass-methods-description:
    order: -1000
  software_versions:
    order: -1001
  nf-core-bacass-summary:
    order: -1002

export_plots: true

disable_version_detection: true

use_filename_as_sample_name:
  - prokka
  - bakta

# Customise the module search patterns to speed up execution time.
sp:
  fastp:
    fn: "*.fastp.json"
